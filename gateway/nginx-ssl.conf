# Docker DNS: адреса сервисов резолвятся заново каждые 10 с, поэтому после
# пересоздания контейнеров шлюз не нужно перезапускать.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP → HTTPS redirect
server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Современные протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — браузер запомнит HTTPS на 1 год
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    set $user_svc       http://user-service:8000;
    set $contest_svc    http://contest-service:8000;
    set $payment_svc    http://payment-service:8000;
    set $eval_svc       http://evaluation-service:8000;
    set $audit_svc      http://audit-service:8000;
    set $monitoring_svc http://monitoring-service:8000;

    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    location /auth/         { proxy_pass $user_svc; }
    location /users         { proxy_pass $user_svc; }

    location /wallet        { proxy_pass $payment_svc; }
    location /payments      { proxy_pass $payment_svc; }
    location /escrow        { proxy_pass $payment_svc; }
    location /transactions  { proxy_pass $payment_svc; }
    location /payouts       { proxy_pass $payment_svc; }
    location /withdrawals   { proxy_pass $payment_svc; }

    location /evaluation    { proxy_pass $eval_svc; }

    location /audit         { proxy_pass $audit_svc; }
    location /monitoring    { proxy_pass $monitoring_svc; }

    location /ws/ {
        proxy_pass $contest_svc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /              { proxy_pass $contest_svc; }
}
