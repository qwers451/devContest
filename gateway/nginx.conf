upstream user-service    { server user-service:8000; }
upstream contest-service { server contest-service:8000; }
upstream payment-service { server payment-service:8000; }
upstream eval-service    { server evaluation-service:8000; }

server {
    listen 8080;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase buffer sizes for file uploads
    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # User service
    location /auth/         { proxy_pass http://user-service; }
    location /users         { proxy_pass http://user-service; }

    # Payment service
    location /wallet        { proxy_pass http://payment-service; }
    location /payments      { proxy_pass http://payment-service; }
    location /escrow        { proxy_pass http://payment-service; }
    location /transactions  { proxy_pass http://payment-service; }
    location /payouts       { proxy_pass http://payment-service; }
    location /withdrawals   { proxy_pass http://payment-service; }

    # Evaluation service
    location /evaluation    { proxy_pass http://eval-service; }

    # Contest service (catch-all for /contests, /submissions, /contest-types, /statistics)
    location /              { proxy_pass http://contest-service; }
}
