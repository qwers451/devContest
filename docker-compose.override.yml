services:
  frontend:
    build:
      context: ./frontend
      target: builder
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_USER_API_URL: ${VITE_USER_API_URL:-http://localhost:8001}
      VITE_CONTEST_API_URL: ${VITE_CONTEST_API_URL:-http://localhost:8002}
      VITE_IMPORT_EXPORT_API_URL: ${VITE_IMPORT_EXPORT_API_URL:-http://localhost:8002}
      VITE_PAYMENT_API_URL: ${VITE_PAYMENT_API_URL:-http://localhost:8004}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z

  user-service:
    volumes:
      - ./backend/user-service:/app:z
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  contest-service:
    volumes:
      - ./backend/contest-service:/app:z
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  evaluation-service:
    volumes:
      - ./backend/evaluation-service:/app:z
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  payment-service:
    volumes:
      - ./backend/payment-service:/app:z
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
