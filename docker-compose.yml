services:

  user-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  contest-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contest_db
      POSTGRES_USER: contest_svc
      POSTGRES_PASSWORD: ${CONTEST_DB_PASSWORD}
    volumes:
      - contest_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contest_svc -d contest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  evaluation-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evaluation_db
      POSTGRES_USER: eval_svc
      POSTGRES_PASSWORD: ${EVAL_DB_PASSWORD}
    volumes:
      - evaluation_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval_svc -d evaluation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_svc
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_svc -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5



  user-service:
    build: ./backend/user-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user_svc:${USER_DB_PASSWORD}@user-db:5432/user_db
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      user-db:
        condition: service_healthy

  contest-service:
    build: ./backend/contest-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://contest_svc:${CONTEST_DB_PASSWORD}@contest-db:5432/contest_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      USER_SERVICE_URL: http://user-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      EVALUATION_SERVICE_URL: http://evaluation-service:8000
    volumes:
      - contest_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      contest-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      evaluation-service:
        condition: service_healthy

  evaluation-service:
    build: ./backend/evaluation-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://eval_svc:${EVAL_DB_PASSWORD}@evaluation-db:5432/evaluation_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llava:7b}
      EVALUATION_STUB: ${EVALUATION_STUB:-false}
      CONTEST_SERVICE_URL: http://contest-service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      evaluation-db:
        condition: service_healthy

  payment-service:
    build: ./backend/payment-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://payment_svc:${PAYMENT_DB_PASSWORD}@payment-db:5432/payment_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:3000/payment/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CONTEST_SERVICE_URL: http://contest-service:8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      payment-db:
        condition: service_healthy


  gateway:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      contest-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      evaluation-service:
        condition: service_healthy


  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      user-service:
        condition: service_healthy
      contest-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  tests:
    image: python:3.12-slim
    restart: unless-stopped
    profiles: ["tests"]
    working_dir: /workspace
    environment:
      PYTEST_USER_URL: http://user-service:8000
      PYTEST_CONTEST_URL: http://contest-service:8000
      PYTEST_SERVICE_STARTUP_TIMEOUT: ${PYTEST_SERVICE_STARTUP_TIMEOUT:-45}
      PYTEST_SERVICE_POLL_INTERVAL: ${PYTEST_SERVICE_POLL_INTERVAL:-1}
    volumes:
      - .:/workspace:z
    command: sh /workspace/tests/pytest/run-tests.sh
    depends_on:
      user-service:
        condition: service_healthy
      contest-service:
        condition: service_healthy

volumes:
  user_db_data:
  contest_db_data:
  evaluation_db_data:
  payment_db_data:
  contest_uploads:
