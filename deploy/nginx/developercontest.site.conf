# Хостовый nginx демо-стенда. Сертификаты выпускает certbot (deploy/deploy.sh).
#   /        → frontend (127.0.0.1:3000)
#   /api/    → gateway  (127.0.0.1:8080), префикс /api срезается
#   /mail/   → Mailpit  (127.0.0.1:8025), закрыт basic-auth

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name developercontest.site www.developercontest.site;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://developercontest.site$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.developercontest.site;

    ssl_certificate     /etc/letsencrypt/live/developercontest.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/developercontest.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://developercontest.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name developercontest.site;

    ssl_certificate     /etc/letsencrypt/live/developercontest.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/developercontest.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /mail { return 301 /mail/; }
    location /mail/ {
        auth_basic "devContest mail";
        auth_basic_user_file /etc/nginx/devcontest-mail.htpasswd;
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
